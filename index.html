<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>La Course des Tables</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Course Tables">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{background:linear-gradient(160deg,#4f46e5,#7c3aed 45%,#db2777);display:flex;align-items:center;justify-content:center;color:#1e293b;user-select:none}
#app{width:100%;height:100%;max-width:760px;display:flex;flex-direction:column;padding:10px;gap:10px}
.topbar{background:rgba(255,255,255,.95);border-radius:18px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.title{font-size:clamp(18px,4vw,26px);font-weight:800;color:#7c3aed}
.title span{color:#db2777}
.progress{font-size:14px;font-weight:700;color:#475569}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{width:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:rgba(255,255,255,.18);padding:10px;border-radius:20px}
.cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(11px,2.4vw,18px);position:relative;background:#fff;color:#64748b;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .15s}
.cell .num{opacity:.55}
.cell.start{background:#22c55e;color:#fff}
.cell.finish{background:#f59e0b;color:#fff}
.cell.bonus{background:#bbf7d0;color:#15803d}
.cell.malus{background:#fecdd3;color:#be123c}
.cell .ic{font-size:clamp(13px,3vw,22px)}
.pawn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4.5vw,30px);z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:hop .4s ease}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-30%) scale(1.15)}100%{transform:translateY(0)}}
.cell.active{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 0 0 6px #7c3aed;z-index:4}
.panel{background:rgba(255,255,255,.97);border-radius:20px;padding:14px;box-shadow:0 -6px 24px rgba(0,0,0,.25);min-height:150px;display:flex;flex-direction:column;gap:10px}
.msg{text-align:center;font-size:clamp(15px,3.5vw,19px);font-weight:700;min-height:24px;color:#334155}
.question{text-align:center;font-size:clamp(30px,9vw,52px);font-weight:900;color:#1e293b}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.answers button{border:none;border-radius:16px;padding:16px 0;font-size:clamp(20px,5vw,30px);font-weight:800;background:#ede9fe;color:#5b21b6;cursor:pointer;box-shadow:0 4px 0 #c4b5fd}
.answers button.good{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.answers button.bad{background:#ef4444;color:#fff;box-shadow:0 4px 0 #b91c1c}
.bigbtn{border:none;border-radius:18px;padding:18px;font-size:clamp(18px,4.5vw,24px);font-weight:800;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.roll{background:linear-gradient(135deg,#f59e0b,#f97316)}
.dice{font-size:clamp(40px,11vw,64px);text-align:center}
.rolling{animation:spin .5s linear}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.overlay{position:absolute;inset:0;background:rgba(30,27,75,.85);display:flex;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:30px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h1{font-size:clamp(26px,7vw,40px);color:#7c3aed;margin-bottom:6px}
.card h1 span{color:#db2777}
.card p{color:#475569;font-size:16px;line-height:1.5;margin-bottom:18px}
.card .emoji{font-size:64px;margin-bottom:8px}
.card .bigbtn{width:100%;background:linear-gradient(135deg,#7c3aed,#db2777)}
.stat{font-size:18px;font-weight:700;color:#334155;margin-bottom:16px}
.stat b{color:#16a34a}
</style></head><body>
<div id="app">
<div class="topbar"><div class="title">La Course des <span>Tables</span> 🎲</div><div class="progress" id="progress">Case 0 / 39</div></div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="panel" id="panel"><div class="msg" id="msg">Lance le dé pour commencer !</div><div style="text-align:center"><div class="dice" id="dice">🎲</div></div><button class="bigbtn roll" id="rollBtn">🎲 Lancer le dé</button></div>
</div>
<div class="overlay" id="startOverlay"><div class="card"><div class="emoji">🚀</div><h1>La Course des <span>Tables</span></h1><p>Lance le dé, réponds à la multiplication.<br>✅ Bonne réponse → tu avances !<br>❌ Mauvaise réponse → tu recules de 2.<br>Arrive à la case finale 🏁</p><button class="bigbtn" id="playBtn">Jouer !</button></div></div>
<div class="overlay" id="winOverlay" style="display:none"><div class="card"><div class="emoji">🏆</div><h1>Bravo&nbsp;!</h1><p id="winText"></p><div class="stat" id="winStat"></div><button class="bigbtn" id="replayBtn">Rejouer</button></div></div>
<script>
const TOTAL=40,LAST=TOTAL-1,BONUS={7:13,18:25,30:36},MALUS={15:9,27:20,34:28},F=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let pos=0,good=0,bad=0,rolls=0,busy=false;
const board=document.getElementById('board'),prog=document.getElementById('progress'),panel=document.getElementById('panel');
function build(){board.innerHTML='';const c=8,r=Math.ceil(TOTAL/c),o=[];for(let i=0;i<r;i++){const a=[];for(let j=0;j<c;j++){const k=i*c+j;if(k<TOTAL)a.push(k);}if(i%2)a.reverse();o.push(...a);}o.forEach(p=>{const e=document.createElement('div');e.className='cell';e.dataset.pos=p;if(p===0){e.classList.add('start');e.innerHTML='<span class="ic">🏠</span>';}else if(p===LAST){e.classList.add('finish');e.innerHTML='<span class="ic">🏁</span>';}else if(BONUS[p]!==undefined){e.classList.add('bonus');e.innerHTML='<span class="ic">🪜</span>';}else if(MALUS[p]!==undefined){e.classList.add('malus');e.innerHTML='<span class="ic">🐍</span>';}else{e.innerHTML='<span class="num">'+p+'</span>';}board.appendChild(e);});pawn();}
function pawn(){document.querySelectorAll('.pawn').forEach(x=>x.remove());document.querySelectorAll('.cell.active').forEach(x=>x.classList.remove('active'));const e=board.querySelector('.cell[data-pos="'+pos+'"]');if(e){e.classList.add('active');const w=document.createElement('div');w.className='pawn';w.textContent='🦄';e.appendChild(w);}prog.textContent='Case '+pos+' / '+LAST;}
function q(){const a=2+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*10);return{a,b,r:a*b};}
function dist(c,a,b){const s=new Set([c]);[c+1,c-1,c+a,c+b,a*(b+1),a*(b-1),(a+1)*b,c+10,c-10].forEach(v=>{if(v>0&&v!==c&&s.size<4)s.add(v);});let g=2;while(s.size<4){if(c+g>0)s.add(c+g);g++;}const r=[...s].slice(0,4);for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function ask(d){const x=q(),o=dist(x.r,x.a,x.b);panel.innerHTML='<div class="msg">Tu as fait '+d+' 🎲 — réponds bien !</div><div class="question">'+x.a+' × '+x.b+' = ?</div><div class="answers" id="ans"></div>';const ae=document.getElementById('ans');o.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>ansClick(b,v,x.r,d,ae);ae.appendChild(b);});}
function ansClick(btn,v,c,d,ae){[...ae.children].forEach(b=>b.disabled=true);if(v===c){good++;btn.classList.add('good');flash('✅ Bravo ! Tu avances de '+d+'.');setTimeout(()=>move(d),700);}else{bad++;btn.classList.add('bad');[...ae.children].forEach(b=>{if(+b.textContent===c)b.classList.add('good');});flash('❌ Oups ! C\'était '+c+'. Tu recules de 2.');setTimeout(()=>move(-2),1100);}}
function flash(t){const m=panel.querySelector('.msg');if(m)m.textContent=t;}
function move(s){let t=pos+s;if(t<0)t=0;if(t>LAST)t=LAST;anim(pos,t,()=>{pos=t;if(BONUS[pos]!==undefined){const d=BONUS[pos];flash('🪜 Une échelle te propulse !');setTimeout(()=>anim(pos,d,()=>{pos=d;after();}),600);}else if(MALUS[pos]!==undefined){const d=MALUS[pos];flash('🐍 Un serpent te fait glisser...');setTimeout(()=>anim(pos,d,()=>{pos=d;after();}),600);}else after();});}
function anim(f,t,done){const dir=t>=f?1:-1;let cur=f;(function st(){if(cur===t){pawn();done();return;}cur+=dir;pos=cur;pawn();setTimeout(st,180);})();}
function after(){if(pos>=LAST){win();return;}reset();busy=false;}
function reset(){panel.innerHTML='<div class="msg">À toi de jouer ! Lance le dé 🎲</div><div style="text-align:center"><div class="dice">'+F[1]+'</div></div><button class="bigbtn roll" id="rollBtn">🎲 Lancer le dé</button>';document.getElementById('rollBtn').onclick=roll;}
function roll(){if(busy)return;busy=true;rolls++;const d=panel.querySelector('.dice');d.classList.add('rolling');let n=0;const iv=setInterval(()=>{d.textContent=F[1+Math.floor(Math.random()*6)];if(++n>=8){clearInterval(iv);d.classList.remove('rolling');const f=1+Math.floor(Math.random()*6);d.textContent=F[f];setTimeout(()=>ask(f),400);}},70);}
function win(){document.getElementById('winText').textContent='Tu as atteint la case finale ! 🏁';document.getElementById('winStat').innerHTML='Bonnes réponses : <b>'+good+'</b> • Erreurs : '+bad+'<br>Lancers : '+rolls;document.getElementById('winOverlay').style.display='flex';}
function start(){pos=0;good=0;bad=0;rolls=0;busy=false;build();reset();}
document.getElementById('playBtn').onclick=()=>{document.getElementById('startOverlay').style.display='none';start();};
document.getElementById('replayBtn').onclick=()=>{document.getElementById('winOverlay').style.display='none';start();};
document.getElementById('rollBtn').onclick=roll;build();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
