<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { background:linear-gradient(160deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%); display:flex; align-items:center; justify-content:center; color:#1e293b; user-select:none; }
  #app { width:100%; height:100%; max-width:760px; display:flex; flex-direction:column; padding:10px; gap:10px; }
  .topbar { background:rgba(255,255,255,0.95); border-radius:18px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .title { font-size:clamp(18px,4vw,26px); font-weight:800; color:#7c3aed; letter-spacing:-.5px; }
  .title span { color:#db2777; }
  .progress { font-size:14px; font-weight:700; color:#475569; }
  .board-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  .board { width:100%; display:grid; grid-template-columns:repeat(8,1fr); gap:6px; background:rgba(255,255,255,0.18); padding:10px; border-radius:20px; }
  .cell { aspect-ratio:1; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(11px,2.4vw,18px); position:relative; background:#ffffff; color:#64748b; box-shadow:inset 0 -3px 0 rgba(0,0,0,.08); transition:transform .15s; }
  .cell .num { opacity:.55; }
  .cell.start { background:#22c55e; color:#fff; }
  .cell.finish { background:#f59e0b; color:#fff; }
  .cell.bonus { background:#bbf7d0; color:#15803d; }
  .cell.malus { background:#fecdd3; color:#be123c; }
  .cell .ic { font-size:clamp(13px,3vw,22px); }
  .pawn { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(18px,4.5vw,30px); z-index:5; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4)); animation:hop .4s ease; }
  @keyframes hop { 0%{transform:translateY(0)} 50%{transform:translateY(-30%) scale(1.15)} 100%{transform:translateY(0)} }
  .cell.active { transform:scale(1.06); box-shadow:0 0 0 3px #fff, 0 0 0 6px #7c3aed; z-index:4; }
  .panel { background:rgba(255,255,255,0.97); border-radius:20px; padding:14px; box-shadow:0 -6px 24px rgba(0,0,0,.25); min-height:150px; display:flex; flex-direction:column; gap:10px; }
  .msg { text-align:center; font-size:clamp(15px,3.5vw,19px); font-weight:700; min-height:24px; color:#334155; }
